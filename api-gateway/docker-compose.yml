version: "3.8"

services:
  api-gateway:
    build: .
    container_name: api-gateway
    environment:
      - DT_SERVICE_NAME=api-gateway
    ports:
      - "8080:8080"
    networks:
      - backend

volumes:
  mysql_data:
    driver: local

networks:
  backend:
    external: true
    name: microservices-net