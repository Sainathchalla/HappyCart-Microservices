version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: inventory-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: inventory-service
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  adminer:
    image: adminer
    container_name: mysql-adminer-inventory
    restart: always
    ports:
      - "8092:8080"
    depends_on:
      - mysql
    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend: