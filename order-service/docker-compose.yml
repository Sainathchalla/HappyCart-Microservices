version: "3.8"

services:
  order-mysql:
    image: mysql:8.0
    container_name: order-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: order-service
    volumes:
      - order_mysql_data:/var/lib/mysql
    networks:
      - backend

  adminer:
    image: adminer
    container_name: mysql-adminer-order
    restart: always
    ports:
      - "8091:8080"
    depends_on:
      - order-mysql
    networks:
      - backend

  order-service:
    build: .
    container_name: order-service
    environment:
      - DT_SERVICE_NAME=order-service
    ports:
      - "8082:8082"
    depends_on:
      - order-mysql
    networks:
      - backend

volumes:
  order_mysql_data:
    driver: local

networks:
  backend:
    external: true
    name: microservices-net